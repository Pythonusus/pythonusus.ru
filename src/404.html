<!doctype html>
<html lang="ru" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ошибка 404: страница не найдена" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>404 — страница не найдена</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header id="header" class="border-bottom"></header>
    <main class="flex-grow-1 d-flex align-items-center">
      <section class="error-page container py-5">
        <div class="error-content mx-auto text-center">
          <p class="error-code fw-bold text-warning lh-1">404</p>
          <h1 class="display-5 my-3">Страница не найдена</h1>
          <p class="text-body-secondary mb-4">
            Я обыскал всю базу данных, даже спросил у старого сервера в подвале,
            но он только странно зашумел. Страницы нет. Честно.
          </p>
          <a href="/" class="btn btn-outline-light">Вернуться на главную</a>
        </div>
      </section>
    </main>
    <footer id="footer" class="border-top py-2 mt-auto"></footer>
    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
