name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA for deploy'
        required: true
        type: string
        default: ''

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PORT: ${{ secrets.PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: PORT
          script: |
            set -e

            TMP_DIR=$(mktemp -d)
            trap "echo '🧹 Cleaning up temporary files...'; rm -rf ${TMP_DIR}" EXIT

            echo "🚀 Deploying commit: ${{ github.event.inputs.commit_sha }}"

            cd "$TMP_DIR"
            git init
            git remote add origin https://github.com/${{ github.repository }}.git

            echo "📥 Downloading code..."
            git fetch --depth 1 origin ${{ github.event.inputs.commit_sha }}
            git checkout FETCH_HEAD

            echo "🔨 Running deploy.sh..."
            ./deploy.sh

            # trap exit will be triggered here automatically
